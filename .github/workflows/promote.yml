name: Promote

# Moves an npm dist tag to an already published version, for example `latest` to the release
# candidate that proved itself. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version of @sweberdev/vector, e.g. 2.0.0
        required: true
      tag:
        description: Dist tag to set
        required: true
        default: latest

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The token stays an env placeholder and is resolved by npm at run time.
      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
      - name: Set the dist tag
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version"; exit 1; }
          [[ "$TAG" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Invalid tag"; exit 1; }
          npm view "@sweberdev/vector@$VERSION" version
          npm dist-tag add "@sweberdev/vector@$VERSION" "$TAG"
          npm dist-tag ls @sweberdev/vector
